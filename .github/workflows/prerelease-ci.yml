name: Pre-release CI

on:
  push:
    tags:
      - "v*-alpha*"
      - "v*-beta*"
      - "v*-rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to validate, for example v0.2.0-rc.1"
        required: true
        type: string

jobs:
  build-and-unit:
    name: Build + Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: brew install just

      - name: Verify vendored QuickJS-NG
        run: just verify-quickjs-vendor

      - name: Build
        run: just build

      - name: Run unit tests
        run: just test-unit-ci

      - name: Run post-response script UI automation
        run: just test-scripting
