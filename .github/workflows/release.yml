name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: brew install just create-dmg

      - name: Run unit tests
        run: just test-unit-ci

      - name: Build DMG
        run: just package-dmg-styled-free

      - name: Rename DMG
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          cp dist/NativeCurlRunner.dmg "dist/NativeCurlRunner-${TAG_NAME}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeCurlRunner-dmg
          path: dist/NativeCurlRunner-*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" "dist/NativeCurlRunner-${TAG_NAME}.dmg" --clobber
