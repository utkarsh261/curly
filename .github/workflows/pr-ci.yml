name: PR CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-unit:
    name: Build + Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: brew install just

      - name: Verify vendored QuickJS-NG
        run: just verify-quickjs-vendor

      - name: Build
        run: just build

      - name: Run unit tests
        run: just test-unit-ci

      - name: Run post-response script UI automation
        run: just test-scripting
